<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5"/>

  <!-- Subtle Inner Ring Accent -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#neonGlow)" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Paw Print Group with Filter Glow -->
  <g filter="url(#glow)">
    <!-- 4 Toe Pads -->
    <!-- Toe 1 (Leftmost) -->
    <ellipse cx="17.5" cy="22" rx="4" ry="5.5" transform="rotate(-20 17.5 22)" fill="url(#pawGrad)"/>
    <!-- Toe 2 (Center Left) -->
    <ellipse cx="26" cy="16.5" rx="4.2" ry="6" transform="rotate(-6 26 16.5)" fill="url(#pawGrad)"/>
    <!-- Toe 3 (Center Right) -->
    <ellipse cx="38" cy="16.5" rx="4.2" ry="6" transform="rotate(6 38 16.5)" fill="url(#pawGrad)"/>
    <!-- Toe 4 (Rightmost) -->
    <ellipse cx="46.5" cy="22" rx="4" ry="5.5" transform="rotate(20 46.5 22)" fill="url(#pawGrad)"/>

    <!-- Main Palm Pad -->
    <path d="M 32 27.5
             C 41 27.5, 48 33, 47 41
             C 46.5 44.5, 43 49.5, 37.5 49
             C 34.5 48.7, 33 46.5, 32 46.5
             C 31 46.5, 29.5 48.7, 26.5 49
             C 21 49.5, 17.5 44.5, 17 41
             C 16 33, 23 27.5, 32 27.5 Z"
          fill="url(#pawGrad)"/>
  </g>

  <!-- Code Brackets & Slash in Center of Palm Pad -->
  <!-- Left bracket < -->
  <path d="M 27 34.5 L 24 37.5 L 27 40.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Slash / -->
  <line x1="30.5" y1="41" x2="33.5" y2="34" stroke="#e0e7ff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right bracket > -->
  <path d="M 37 34.5 L 40 37.5 L 37 40.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI Sparkle Star on Top-Right -->
  <path d="M 52 7 Q 52 11 56 11 Q 52 11 52 15 Q 52 11 48 11 Q 52 11 52 7 Z" fill="#38bdf8"/>
  <circle cx="52" cy="11" r="1" fill="#ffffff"/>
</svg>
