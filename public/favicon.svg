<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Glowing Cyan/Blue Cyber Shield Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09051d" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- NO background square/box/white parts: Pure transparent backdrop for tab -->

  <!-- Binary Ring Orbit Arc -->
  <circle cx="32" cy="27" r="23" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-dasharray="2, 2.5" stroke-width="1.2"/>
  
  <!-- Outer Shield Crest with Neon Filter -->
  <g filter="url(#neonGlow)">
    <!-- Main Outer Cyber Shield -->
    <path d="M 32 6
             L 49 11.5
             C 49 24, 47 35, 32 46
             C 17 35, 15 24, 15 11.5
             Z"
          fill="url(#shieldFill)"
          stroke="url(#cyanNeon)"
          stroke-width="2"
          stroke-linejoin="round"/>

    <!-- Inner Circuit M-Shape Crest -->
    <path d="M 20.5 15
             L 32 11
             L 43.5 15
             L 42.5 27
             C 41.5 34, 37 39.5, 32 42.5
             C 27 39.5, 22.5 34, 21.5 27
             Z"
          fill="none"
          stroke="#38bdf8"
          stroke-width="1.2"
          stroke-opacity="0.75"/>

    <!-- Circuit M lines -->
    <path d="M 24.5 30.5 L 24.5 20.5 L 32 26 L 39.5 20.5 L 39.5 30.5"
          fill="none"
          stroke="#67e8f9"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Central Code Curly Brackets { } -->
    <!-- Left curly bracket { -->
    <path d="M 27.5 28.5 C 26.5 28.5, 25.5 29.5, 25.5 31 C 25.5 32, 24.5 32, 23.5 32 C 24.5 32, 25.5 32, 25.5 33 C 25.5 34.5, 26.5 35.5, 27.5 35.5"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.8"
          stroke-linecap="round"/>
    
    <!-- Right curly bracket } -->
    <path d="M 36.5 28.5 C 37.5 28.5, 38.5 29.5, 38.5 31 C 38.5 32, 39.5 32, 40.5 32 C 39.5 32, 38.5 32, 38.5 33 C 38.5 34.5, 37.5 35.5, 36.5 35.5"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.8"
          stroke-linecap="round"/>

    <!-- 4-Point Radiant AI Sparkle Star -->
    <path d="M 32 27.5 Q 32 32 35.5 32 Q 32 32 32 36.5 Q 32 32 28.5 32 Q 32 32 32 27.5 Z"
          fill="url(#starGrad)"/>
    <circle cx="32" cy="32" r="1" fill="#ffffff"/>
  </g>

  <!-- Clean Glowing CODEMATE AI text at the bottom -->
  <text x="32" y="58"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="5.5"
        font-weight="900"
        letter-spacing="0.8"
        text-anchor="middle"
        fill="#67e8f9"
        filter="drop-shadow(0px 1px 3px rgba(6,182,212,0.8))">
    CODEMATE AI
  </text>
</svg>
